[project]
name = "flowfield2d"
version = "0.0.1"
description = "Location-agnostic driver for HEC-RAS 2025 2D models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.11",
    "numpy>=2.0",
    "typer>=0.12",
    "filelock>=3.13",
    "rasterio>=1.3",
    "shapely>=2.0",
    "psutil>=5.9",
    "scipy>=1.13",
    "pyarrow>=26.0.0",
]

[project.scripts]
flowfield2d = "flowfield2d.cli:app"
agentops = "flowfield2d.agentops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs>=1.18.1.1",
]
# PROBE_PROCEDURE.md section 1: tools/probe needs these in the repo env.
probe = [
    "pefile>=2023.2.7",
    "dnfile>=0.15",
]

[tool.uv]
default-groups = ["dev", "probe"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "tools/probe/tests"]
markers = ["ras: needs the pinned HEC-RAS build (deselected by default)"]
addopts = "-m 'not ras' --timeout=120"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as call defaults by design
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
sqlite_cache = false

[[tool.mypy.overrides]]
# h5py, rasterio and pyarrow ship no type stubs or py.typed marker.
module = ["h5py", "h5py.*", "rasterio", "rasterio.*", "shapely", "shapely.*", "psutil",
          "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
